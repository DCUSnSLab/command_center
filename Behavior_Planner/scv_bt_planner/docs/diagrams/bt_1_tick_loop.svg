<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="콜백이 Context 입력을 갱신하고, 20 Hz 틱이 Context 초기화·앵커 이동량 계산·트리 평가·출력 소비 순서로 돈 뒤 토픽을 발행한다.">
  <style>
  svg { color:#172019; font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
  .box { fill:#FFFFFF; stroke:currentColor; stroke-width:1.2; }
  .st { fill:#FFFFFF; stroke:currentColor; stroke-width:1.4; }
  .st.on { fill:#E3F0EE; stroke:#0E6F6A; }
  .st.bad { fill:#F7E3DF; stroke:#A2382B; }
  .st.warn { fill:#F7EBDC; stroke:#A5621B; }
  .ctl .box { fill:#E3F0EE; stroke:#0E6F6A; }
  .cond .box { stroke-dasharray:4 3; }
  .act .box { stroke-width:1.8; }
  .in .box { fill:#EDF1EF; }
  text { fill:currentColor; font-size:11.5px; }
  .sub { font-size:10px; fill:#5D6A63; }
  .lbl { font-size:10.5px; fill:#5D6A63; }
  .head { font-size:11px; font-weight:600; letter-spacing:0.06em; fill:#5D6A63; }
  .edge { stroke:currentColor; stroke-width:1.1; fill:none; }
  .edge.acc { stroke:#0E6F6A; }
  .edge.crit { stroke:#A2382B; }
  .edge.warn { stroke:#A5621B; }
  </style>
  <rect width="860" height="300" fill="#F4F7F5"/>
      <defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
      <text x="20" y="22" class="head">구독 콜백 (비동기)</text>
      <g class="in">
        <rect class="box" x="20" y="34" width="150" height="34" rx="4"/><text x="95" y="56" text-anchor="middle">/odometry/global</text>
        <rect class="box" x="20" y="76" width="150" height="34" rx="4"/><text x="95" y="98" text-anchor="middle">/planned_path_detailed</text>
        <rect class="box" x="20" y="118" width="150" height="34" rx="4"/><text x="95" y="140" text-anchor="middle">/goal_status</text>
        <rect class="box" x="20" y="160" width="150" height="34" rx="4"/><text x="95" y="182" text-anchor="middle">/hunter_status · /stop_flag</text>
        <rect class="box" x="20" y="202" width="150" height="34" rx="4"/><text x="95" y="224" text-anchor="middle">datum · /costmap · TF</text>
      </g>
      <line class="edge" x1="170" y1="135" x2="228" y2="135" marker-end="url(#a1)"/>
      <rect class="st on" x="230" y="90" width="130" height="90" rx="6"/>
      <text x="295" y="125" text-anchor="middle">Context</text>
      <text x="295" y="143" text-anchor="middle" class="sub">입력 · 경로 · 이력</text>
      <text x="295" y="158" text-anchor="middle" class="sub">에스컬레이션 상태기계</text>
      <text x="420" y="22" class="head">20 Hz 틱 (동기)</text>
      <g>
        <rect class="box" x="420" y="34" width="180" height="34" rx="4"/><text x="510" y="56" text-anchor="middle">① 틱 출력 초기화</text>
        <rect class="box" x="420" y="82" width="180" height="34" rx="4"/><text x="510" y="104" text-anchor="middle">② map→odom 이동량 계산</text>
        <rect class="box" x="420" y="130" width="180" height="34" rx="4"/><text x="510" y="152" text-anchor="middle">③ tree.tickOnce()</text>
        <rect class="box" x="420" y="178" width="180" height="34" rx="4"/><text x="510" y="200" text-anchor="middle">④ 출력 소비</text>
        <line class="edge" x1="510" y1="68" x2="510" y2="80" marker-end="url(#a1)"/>
        <line class="edge" x1="510" y1="116" x2="510" y2="128" marker-end="url(#a1)"/>
        <line class="edge" x1="510" y1="164" x2="510" y2="176" marker-end="url(#a1)"/>
      </g>
      <line class="edge acc" x1="360" y1="135" x2="418" y2="147" marker-end="url(#a1)"/>
      <text x="366" y="128" class="lbl" style="fill:#0E6F6A">읽기/쓰기</text>
      <text x="640" y="22" class="head">발행</text>
      <g class="act">
        <rect class="box" x="640" y="34" width="200" height="30" rx="4"/><text x="740" y="54" text-anchor="middle">MPPIParams (프로필 변경 시)</text>
        <rect class="box" x="640" y="70" width="200" height="30" rx="4"/><text x="740" y="90" text-anchor="middle">MultipleWaypoints · TargetWaypoints</text>
        <rect class="box" x="640" y="106" width="200" height="30" rx="4"/><text x="740" y="126" text-anchor="middle">PauseCommand</text>
        <rect class="box" x="640" y="142" width="200" height="30" rx="4"/><text x="740" y="162" text-anchor="middle">behavior_status · assist_request</text>
        <rect class="box" x="640" y="178" width="200" height="30" rx="4"/><text x="740" y="198" text-anchor="middle">emergency_stop (Stop 일 때만)</text>
        <rect class="box" x="640" y="214" width="200" height="30" rx="4"/><text x="740" y="234" text-anchor="middle">/bt/behavior (결정 트레이스)</text>
      </g>
      <line class="edge" x1="600" y1="195" x2="638" y2="160" marker-end="url(#a1)"/>
      <text x="420" y="262" class="lbl">shadow 모드는 발행 토픽에 /bt 접두를 붙인다 (명령 없음). active 는 simple BP 와 같은 토픽.</text>
      <text x="420" y="280" class="lbl">④ 는 request_stop 이면 emergency_stop 만 내고 끝난다. 경로·위치가 없으면 아무것도 내지 않는다.</text>
    </svg>
