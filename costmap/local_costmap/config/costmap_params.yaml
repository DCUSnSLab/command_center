# Local Costmap Configuration (C++ version)
# This file contains all parameters for the local_costmap node

/**:
  ros__parameters:
    # === Topic Configuration ===
    point_cloud_topic: '/perception/points_nonground'
    odom_topic: '/odom'

    # === Frame IDs ===
    odom_frame: 'odom'
    base_frame: 'base_link'
    sensor_frame: 'velodyne'

    # === Costmap Dimensions ===
    costmap_width: 20.0          # Width in meters
    costmap_height: 20.0         # Height in meters
    costmap_resolution: 0.1      # Cell size in meters (0.1m = 10cm)

    # === Obstacle Detection ===
    # Heights are relative to the robot (base_link z), not the odom origin
    min_obstacle_height: 0.15     # Minimum height for obstacle detection (meters)
    max_obstacle_height: 2.0     # Maximum height for obstacle detection (meters)

    # === Update Frequency ===
    update_frequency: 10.0       # Hz (costmap update rate)

    # === Sensor Timeout ===
    # If no point cloud arrives within this time, the costmap is cleared
    # to UNKNOWN instead of publishing stale obstacle data
    sensor_timeout: 1.0          # seconds

    # === Raytracing / Persistence (Nav2 obstacle_layer style) ===
    # Obstacles persist until a beam passes through their cell; cells along
    # each beam are cleared to free space
    raytrace_max_range: 20.0     # Max clearing distance from sensor (meters)
    obstacle_max_range: 20.0     # Max marking distance from sensor (meters)
    track_unknown_space: false   # true: never-observed cells stay UNKNOWN(-1)
                                 # (note: MPPI critic treats UNKNOWN as lethal)

    # === Denoise ===
    # Obstacle groups (8-connected) smaller than this are removed as noise;
    # set to 1 to disable
    denoise_minimal_group_size: 2

    # === Robot Footprint ===
    # Robot footprint polygon vertices [x1,y1,x2,y2,x3,y3,x4,y4] in base_link frame
    # Points within this footprint will be filtered out to remove robot body reflections
    robot_footprint: [0.49, 0.3725, 0.49, -0.3725, -0.49, -0.3725, -0.49, 0.3725]

    # === Semantic Static Layer ===
    # map_provider 가 발행하는 의미 격자(주행가능/횡단보도/주행불가)를 얹는다.
    # inflation **뒤에** 적용된다 — 주행불가는 사람이 지도에 그은 경계이지 부딪히는
    # 물체가 아니므로 팽창시키면 좁은 길이 통째로 막힌다.
    # 비용은 올리기만 한다: 지도상 주행가능이어도 지금 그 자리에 장애물이 있을 수 있다.
    use_semantic_layer: true
    # separate: 의미 영역을 /costmap/keepout 으로 따로 발행하고 /costmap 은 물리(LiDAR+팽창)만 담는다.
    #           주행불가 안쪽의 실제 장애물이 지워지지 않는다. smppi 가 keepout 을 별도 비용으로 본다.
    #           keepout 값: 100 주행불가 / 0 그 외 / -1 의미 정보 없음(격자 미수신 또는 map->odom 없음)
    # overlay : 예전 방식 — 팽창 뒤 /costmap 에 주행불가 100 을 덮어쓴다.
    semantic_output: 'separate'
    semantic_grid_topic: '/map_provider_node/semantic/grid'
    map_frame: 'map'
    # 횡단보도 비용 (0~100). 0 = 주행가능과 같은 레벨(아무것도 얹지 않음).
    # 50 이었을 때는 smppi 반발 비용이 목표 비용을 압도해 횡단보도 앞에서 정지했다.
    semantic_crosswalk_cost: 0

    # === Inflation Layer ===
    inflation_radius: 3.0        # Inflation radius in meters (safety margin around obstacles)
    cost_scaling_factor: 10.0     # Cost decay factor (higher = steeper decay, range: 1.0~20.0)
